name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/unit

  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/lab-install-check"
          "$RUNNER_TEMP/lab-install-check/bin/python" -m pip install dist/*.whl
      - name: Import supported public API outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/lab-install-check/bin/python" -I -c '
          import lab
          from lab.studies.common.pairing import assert_unique_seeds
          assert lab.__file__
          assert assert_unique_seeds
          print(f"installed lab package: {lab.__file__}")
          '

  cross-repository-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[integration]'
      - name: Run integration suite with coverage report
        run: python -m pytest --cov=lab --cov-report=term-missing tests/integration
