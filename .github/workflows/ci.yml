name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/unit

  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: Install wheel in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/lab-install-check"
          "$RUNNER_TEMP/lab-install-check/bin/python" -m pip install dist/*.whl
      - name: Import supported public API outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/lab-install-check/bin/python" -I -c '
          import lab
          from lab.studies.common.pairing import assert_unique_seeds
          assert lab.__file__
          assert assert_unique_seeds
          print(f"installed lab package: {lab.__file__}")
          '

  cross-repository-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[integration]'
      - run: python -m pytest tests/integration
