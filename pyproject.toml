[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab"
version = "0.1.0a1"
description = "Biopeia scientific apparatus and study utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
integration = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@67f683559cd680ab3320380cbe132dfd7fe0fb5 ; python_version >= '3.12'",
    "environment @ git+https://github.com/biopeia/environment.git@d24382527a5eabce60f1736db58b4843bcc28e1e ; python_version >= '3.12'",
    "observation @ git+https://github.com/biopeia/observation.git@01d01bb51e410b0bbe6903b9a48081c3bee5ed89 ; python_version >= '3.12'",
    "world @ git+https://github.com/biopeia/world.git@95bafc14ecd579b5573c4fadd1d7d3b5833b6c2f ; python_version >= '3.12'",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
