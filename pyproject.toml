[build-system]
requires = ["setuptools>=84.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab"
version = "0.1.0a1"
description = "Biopeia scientific apparatus and study utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
integration = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "embodiment @ git+https://github.com/biopeia/embodiment.git@c456401e9517bbb1fec02d84cbac7e94fddf9d68 ; python_version >= '3.12'",
    "environment @ git+https://github.com/biopeia/environment.git@0ce1a4e3f4dd12529639f032929b8e09df4ce7d7 ; python_version >= '3.12'",
    "observation @ git+https://github.com/biopeia/observation.git@d351df3d7cd2706fdd280a8d4e17359001689dd8 ; python_version >= '3.12'",
    "world @ git+https://github.com/biopeia/world.git@95bafc14ecd579b5573c4fadd1d7d3b5833b6c2f ; python_version >= '3.12'",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
