[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab"
version = "0.1.0a1"
description = "Biopeia scientific apparatus and study utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
integration = [
    "embodiment @ git+https://github.com/biopeia/embodiment.git@5a549c09807508812c47825c51ddb6cbe01a5202",
    "environment @ git+https://github.com/biopeia/environment.git@145e5c293ed599ecfac3c66a0c2dff3bb3832795",
    "observation @ git+https://github.com/biopeia/observation.git@8261dda79551a4ad13bf2b91692098f7509c2c9b",
    "world @ git+https://github.com/biopeia/world.git@186c46812911a69089e610067900a098bfc0d297",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
