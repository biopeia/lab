[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab"
version = "0.1.0a1"
description = "Biopeia scientific apparatus and study utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
integration = [
    "embodiment @ git+https://github.com/biopeia/embodiment.git@047bc4fdb2d3348237295032777b3d6e499c7c89",
    "environment @ git+https://github.com/biopeia/environment.git@c1667f994e18915179d117c8c3caa82e2e440def",
    "observation @ git+https://github.com/biopeia/observation.git@8261dda79551a4ad13bf2b91692098f7509c2c9b",
    "world @ git+https://github.com/biopeia/world.git@8413e263ffa0a7887901a0bb875e24abd2a5e600",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
