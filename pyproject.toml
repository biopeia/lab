[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab"
version = "0.1.0a1"
description = "Biopeia scientific apparatus and study utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
integration = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "environment @ git+https://github.com/biopeia/environment.git@d1dc309636fc66471e755d1f691826ebf8c552fe ; python_version >= '3.12'",
    "observation @ git+https://github.com/biopeia/observation.git@5926df28d75c206f0003c3a8d37bfa4b7901a06f ; python_version >= '3.12'",
    "world @ git+https://github.com/biopeia/world.git@8fbe1b58f82d2189cd83f612aeb91165a5540807 ; python_version >= '3.12'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
